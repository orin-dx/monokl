# callisto configuration

[[package]]
match = "cargo/monokl"
publish-to = ["crates-io", "github-release"]
tag-template = "monokl@{version}"

[release]
product-package = "cargo/monokl"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
asset-name = "monokl-{target}.tar.gz"
