[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV, separate from the toolchain pinned in .prototools; CI's MSRV job verifies it. Bump it with any OXC upgrade (0.154 needs 1.97).
rust-version = "1.96"
license = "FSL-1.1-MIT"
repository = "https://github.com/orin-dx/monokl"
homepage = "https://orin-dx.com"
authors = ["Orin DX Contributors"]
keywords = ["orin-dx", "developer-tools"]
categories = ["development-tools"]
publish = false

[workspace.lints.rust]
# deny rather than forbid so the future napi crate can #[allow] it at the FFI boundary.
unsafe_code = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
map_err_ignore = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

# Version catalogue. A crate adds an entry to its own [dependencies] only when code uses it.
[workspace.dependencies]
# Errors
thiserror = "2"
miette = { version = "7.6", features = ["fancy"] }

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Core data
camino = { version = "1.2", features = ["serde1"] }
rustc-hash = "2.1"
dashmap = "6.1"
blake3 = "1"

# OXC (released in lockstep; bump together)
oxc_parser = "0.151"
oxc_ast = "0.151"
oxc_span = "0.151"
oxc_allocator = "0.151"
oxc_resolver = "11"

# Search
ignore = "0.4"
regex = "1"
grep-regex = "0.1"
grep-searcher = "0.1"
tiktoken-rs = "0.6"
rayon = "1.12"

# CLI and output
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
# Published as michi-core; renamed so code keeps the `michi::` path.
michi = { package = "michi-core", version = "0.6.0" }
tracing = "0.1"

# Dev
insta = { version = "1.48", features = ["yaml", "json", "redactions"] }
pretty_assertions = "1"
proptest = "1"
rstest = "0.27"
tempfile = "3.20"
trycmd = "1.2"
criterion = { version = "0.8", features = ["html_reports"] }
