[package]
name = "monokl"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
keywords = ["monokl", "search", "ast", "semantic", "typescript"]
description = "AST-aware semantic code search for TypeScript/JavaScript and Rust."
publish = false

[lib]
name = "monokl"
path = "src/lib.rs"

[features]
default = ["cli"]

# Agent-facing output via michi, and clap's ValueEnum on CLI-selectable types.
cli = ["dep:clap", "dep:michi", "miette"]

# Miette Diagnostic derive on MonoklError.
miette = ["dep:miette", "michi?/miette"]

[dependencies]
camino.workspace = true
grep-regex.workspace = true
ignore.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

clap = { workspace = true, optional = true }
miette = { workspace = true, optional = true }
michi = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
rstest.workspace = true
