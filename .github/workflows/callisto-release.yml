name: Release

on: {push: {branches: [main]}}

permissions: {}

jobs:
  version-pr:
    runs-on: ubuntu-latest
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: orin-dx/callisto/.github/actions/callisto-action@3feff402ea4798c4708ec6fa09e402b956596598 # callisto@0.14.0
        with: {mode: version-pr, branch: main}
        env:
          GH_TOKEN: ${{ github.token }}

  release:
    runs-on: ubuntu-latest
    concurrency: {group: callisto-release, cancel-in-progress: false}
    permissions: {contents: write, id-token: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0} # zizmor: ignore[artipacked] tag push needs persisted credentials
      - uses: orin-dx/callisto/.github/actions/callisto-action@3feff402ea4798c4708ec6fa09e402b956596598 # callisto@0.14.0
        with: {mode: release}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
